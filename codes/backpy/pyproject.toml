[project]
name = "citra-viva-backend"
version = "0.1.0"
description = "CITRA Viva backend: adversarial AI thesis defense simulator"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-auth>=2.38",
    "requests>=2.32",
    "pypdf>=5.1",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",

    # Telemetry. One span per agent call, so the chain of decisions behind a
    # single turn can be read after the fact instead of inferred from logs.
    # Present in the image but inert: nothing is exported until
    # ENABLE_CLOUD_TRACE is set, and every failure here degrades to no spans
    # rather than to a failed request.
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
]

[project.optional-dependencies]
# Google ADK and Agent Runtime. Kept optional so the Draft Analyzer unit tests
# can run without pulling in these heavy dependencies.
adk = [
    "google-cloud-aiplatform[agent_engines,adk]>=1.112",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    # The ADK agent definitions are part of the architecture, so the test suite
    # has to exercise them rather than take them on trust. Only `google-adk` is
    # needed to build and validate an agent; the heavier `adk` extra above adds
    # Agent Runtime, which is a deployment target rather than a test dependency.
    # The runtime image is built with --no-dev, so none of this ships.
    "google-adk>=2.7",

    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "httpx>=0.28",
    # Only to build PDFs for the extraction tests. Writing a PDF by hand means
    # hand-computing byte offsets, and a test fixture is not worth that.
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
